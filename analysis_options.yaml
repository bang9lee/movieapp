include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/generated_plugin_registrant.dart"
  
  # logger_utils.dart 파일에서 avoid_print 규칙 무시
  errors:
    # deprecated_member_use는 전체적으로 무시
    deprecated_member_use: ignore
    # avoid_print는 Logger 클래스에서만 무시하고 다른 곳에서는 적용
    avoid_print: warning

linter:
  rules:
    # Flutter 기본 규칙
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true  # 일반적으로는 print 사용 금지
    use_key_in_widget_constructors: true