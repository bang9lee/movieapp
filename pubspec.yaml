name: movieapp
description: A new Flutter project for movie information using TMDB API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  
  # State Management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1
  
  # Network
  dio: ^5.3.2
  retrofit: ^4.0.1
  json_annotation: ^4.8.1
  cached_network_image: ^3.2.3
  
  # UI
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  
  # Video Player
  youtube_player_iframe: ^4.0.4
  url_launcher: ^6.1.12
  
  # Utils
  intl: ^0.19.0
  logging: ^1.2.0
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.1.0
  flutter_carousel_slider: ^1.1.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2
  
  # Code generation - 버전 호환성 조정
  build_runner: ^2.4.6
  retrofit_generator: ^7.0.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.2  # 버전 다운그레이드
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/languages/ 
    - assets/images/app_logo.png
    - .env